[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-to-text"
version = "0.1.0"
description = "Transcription audio → texte, 100% hors ligne, avec interface graphique pour Linux (Debian/Ubuntu)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "audio-to-text contributors" }]
keywords = ["whisper", "transcription", "speech-to-text", "offline", "gui", "linux"]

dependencies = [
    # Moteur de reconnaissance vocale (Whisper optimisé CPU via CTranslate2).
    "faster-whisper>=1.1.0",
    # Interface graphique (Qt). Les wheels pip embarquent Qt : aucune dépendance système.
    "PySide6>=6.6",
    # Export au format Word.
    "python-docx>=1.1",
]

[project.scripts]
audio-to-text = "audiototext.app:main"

[project.urls]
Homepage = "https://example.org/audio-to-text"
Source = "https://example.org/audio-to-text"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audiototext = ["assets/*"]
